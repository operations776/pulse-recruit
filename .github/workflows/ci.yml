name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The gates from CLAUDE.md, run on main and on any pull request that still
# opens.
#
# Work now lands by pushing straight to main, so main is where these matter:
# there is no preview URL sitting between a commit and production. The gates
# also run locally before every push, and CI is the backstop that catches what
# a local run cannot, a dirty working tree or a machine-specific pass.
#
# Playwright is NOT run here, deliberately. Two reasons, in order:
#
#   1. Daniyal's standing instruction is that he checks the browser himself.
#      Specs are written and kept honest, not executed by the agent.
#   2. Even without that, these specs need a running app signed in as a seeded
#      user against the live Supabase project. Putting those credentials into
#      Actions to make a green tick appear buys a worse trade than it looks:
#      a shared database that any PR from any branch could write to.
#
#   What is left is genuinely useful and genuinely free of secrets: types,
#   lint, and a real production build.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # `next build` reads these at module scope in the Supabase clients, so the
    # build fails without them. They are the PUBLISHABLE pair, which is safe in
    # a repo secret and safe in the browser bundle: RLS is the boundary, not
    # the key. The service role key is never referenced here.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches the Node the app is developed and deployed on.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # A migration that lands after the code that needs it takes production down.
  # Law 10 says migrations ship first, so a PR that adds one says so loudly
  # rather than relying on somebody remembering at deploy time.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # This used to be `if: pull_request`, which meant it never ran on a push
      # to main. Now that work lands by pushing, that was precisely the case it
      # needed to cover: a migration reaching production with nobody told.
      - name: Flag new migrations
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            # On a push, compare against what main looked like before it.
            RANGE="${{ github.event.before }}..HEAD"
          fi
          NEW=$(git diff --name-only --diff-filter=A $RANGE -- supabase/migrations || true)
          if [ -n "$NEW" ]; then
            echo "::warning title=New migrations::Apply these to Supabase BEFORE the code that needs them (law 10)."
            echo "$NEW" | while read -r f; do echo "::warning file=$f::Apply this migration before the code that needs it."; done
          else
            echo "No new migrations here."
          fi
